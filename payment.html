<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meenakshi Mehta | Payment</title>

    <link rel="stylesheet" href="payment.css" />
  </head>

  <body>
    <div class="payment-container">
      <div class="left">
        <img id="paymentImage" />

        <h2 id="paymentTitle"></h2>

        <h3 id="paymentPrice"></h3>

        <p class="note">Please pay the exact amount shown above.</p>
      </div>

      <div class="right">
        <h2>Scan & Pay</h2>

        <img src="img/My_QR_Code.png" class="qr" />

        <p class="upi">Google Pay QR</p>

        <form id="paymentForm">
          <input type="text" placeholder="Full Name" required />

          <input type="tel" placeholder="Mobile Number" required />

          <input type="email" placeholder="Email Address" required />

          <input
            type="text"
            placeholder="Transaction ID / UTR Number"
            required
          />

          <label class="upload">
            Upload Payment Screenshot

            <input type="file" accept="image/*" required />
          </label>

          <button>Submit Order</button>
        </form>
      </div>
    </div>

    <script src="paintings.js"></script>

    <script src="payment.js"></script>

  </body>
</html>
